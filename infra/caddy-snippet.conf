# Site block for the shared box's Caddyfile, added by setup-caddy.sh.
# Plain HTTP to the container on the edge network; Caddy handles TLS the
# same way it does for relay.modelbrain.net and api.modelbrain.net.
gsc.modelbrain.net {
	request_body {
		max_size 64KB
	}
	reverse_proxy modelbrain-connectors_gsc:8787
}
